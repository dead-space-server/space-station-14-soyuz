name: "Changelog: Send discord webhook"

on:
  pull_request_target:
    types: [closed]

jobs:
  send-discord:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR details
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BODY=$(printf '%s' "$PR_BODY" | base64 -w0)
          echo "DESCRIPTION_B64=$BODY" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "REPO=${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "PR_HTML_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT

      - name: Parse PR and build JSON
        id: parse
        env:
          DESCRIPTION_B64: ${{ steps.extract.outputs.DESCRIPTION_B64 }}
          PR_NUMBER: ${{ steps.extract.outputs.PR_NUMBER }}
          AUTHOR: ${{ steps.extract.outputs.AUTHOR }}
          REPO: ${{ steps.extract.outputs.REPO }}
          PR_HTML_URL: ${{ steps.extract.outputs.PR_HTML_URL }}
        run: |
          python <<'EOF'
          import base64
          import html  # DS14-Soyuz
          import json
          import mimetypes  # DS14-Soyuz
          import os
          import re
          import urllib.request  # DS14-Soyuz

          # DS14-Soyuz-start
          MEDIA_DIR = "/tmp/media"
          MAX_FILES = 10
          MAX_TOTAL = 9 * 1024 * 1024  # лимит вебхука ~10 МБ, оставляем запас
          ALLOWED_HOSTS = re.compile(
              r"^https://(github\.com/user-attachments/(assets|files)/"
              r"|(private-user-images|user-images)\.githubusercontent\.com/)"
          )

          os.makedirs(MEDIA_DIR, exist_ok=True)
          # DS14-Soyuz-end

          def set_output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          desc_b64 = os.environ.get("DESCRIPTION_B64", "")
          desc = base64.b64decode(desc_b64).decode("utf-8", errors="replace")
          desc = re.sub(r"<!--.*?-->", "", desc, flags=re.DOTALL)

          if ":cl:" not in desc:
              print("Skip (:cl: not found)")
              set_output("should_send", "false")
              exit(0)

          sections = {
              "Добавлено": "🆕",
              "Удалено": "❌",
              "Изменено": "⚒️",
              "Исправлено": "🐛",
          }

          pr_number = os.environ.get("PR_NUMBER", "")
          author = os.environ.get("AUTHOR", "unknown")
          pr_html_url = os.environ.get("PR_HTML_URL", "")

          content_lines = [f"👤 Автор: **{author}**", ""]

          for title, emoji in sections.items():
              pattern = rf"- {re.escape(title)}:\s*(.*?)(?=\n- [^:]|$)"

              for block in re.findall(pattern, desc, flags=re.DOTALL):
                  lines = [
                      line.strip("- ").strip()
                      for line in block.splitlines()
                      if line.strip()
                  ]
                  message = re.sub(r"\s+", " ", " ".join(lines)).strip()
                  if message:
                      content_lines.append(f"{emoji} {title} - {message} ([PR #{pr_number}]({pr_html_url}))")

          if len(content_lines) == 2:
              print("No changelog changes found. Skipping Discord notification.")
              set_output("should_send", "false")
              exit(0)

          # DS14-Soyuz-start
          media_pattern = (
              r"!\[[^\]]*\]\((https?://[^)\s]+)\)"            # ![alt](url)
              r"|<img[^>]+src=[\"']([^\"']+)[\"']"             # <img src="url">
              r"|(https://github\.com/user-attachments/\S+)"   # голая ссылка (видео)
          )

          urls = []
          for m in re.finditer(media_pattern, desc):
              url = next(g for g in m.groups() if g)
              url = html.unescape(url).rstrip(")>.,;\"'")
              if url not in urls:
                  urls.append(url)

          saved = 0
          total = 0
          link_fallback = []

          for url in urls:
              if not ALLOWED_HOSTS.match(url):
                  print(f"Пропуск (хост не разрешён): {url}")
                  continue

              if saved >= MAX_FILES:
                  link_fallback.append(url)
                  continue

              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "changelog-bot"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ctype = r.headers.get_content_type()
                      if not (ctype.startswith("image/") or ctype.startswith("video/")):
                          print(f"Пропуск (не медиа, {ctype}): {url}")
                          continue
                      data = r.read(MAX_TOTAL + 1)
              except Exception as e:
                  print(f"Не удалось скачать {url}: {e}")
                  link_fallback.append(url)
                  continue

              if len(data) > MAX_TOTAL or total + len(data) > MAX_TOTAL:
                  link_fallback.append(url)
                  continue

              ext = mimetypes.guess_extension(ctype) or ""
              if ext == ".jpe":
                  ext = ".jpg"

              path = os.path.join(MEDIA_DIR, f"{saved}{ext}")
              with open(path, "wb") as f:
                  f.write(data)

              saved += 1
              total += len(data)

          if link_fallback:
              content_lines.append("")
              content_lines.append("📎 Медиа:")
              content_lines.extend(link_fallback)
          # DS14-Soyuz-end

          message_content = "\n".join(content_lines)

          if len(message_content) > 2000:
              message_content = message_content[:1997] + "..."

          payload = {
              "content": message_content,
              "username": "Изменения Союз-1 ☭",
              "avatar_url": "https://github.com/PERed5/soyuz/blob/main/soyuz.png?raw=true"
          }

          payload_file = "/tmp/discord_payload.json"
          with open(payload_file, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

          set_output("payload_file", payload_file)
          set_output("should_send", "true")
          EOF

      - name: Send to Discord (Main)
        if: steps.parse.outputs.should_send == 'true'
        env:
          PAYLOAD_FILE: ${{ steps.parse.outputs.payload_file }}
          WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "CHANGELOG_DISCORD_WEBHOOK secret is not set"
            exit 1
          fi

          # DS14-Soyuz-start
          FILE_ARGS=()
          i=0
          for f in /tmp/media/*; do
            [ -f "$f" ] || continue
            FILE_ARGS+=(-F "files[$i]=@$f")
            i=$((i+1))
          done

          curl -X POST \
            -F "payload_json=<$PAYLOAD_FILE;type=application/json" \
            "${FILE_ARGS[@]}" \
            "$WEBHOOK_URL" \
            --fail \
            --silent \
            --show-error
          # DS14-Soyuz-end

      - name: Send to Discord (Deadspace)
        if: steps.parse.outputs.should_send == 'true'
        env:
          PAYLOAD_FILE: ${{ steps.parse.outputs.payload_file }}
          WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_DEADSPACE }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "CHANGELOG_DISCORD_WEBHOOK_DEADSPACE secret is not set"
            exit 1
          fi

          # DS14-Soyuz-start
          FILE_ARGS=()
          i=0
          for f in /tmp/media/*; do
            [ -f "$f" ] || continue
            FILE_ARGS+=(-F "files[$i]=@$f")
            i=$((i+1))
          done

          curl -X POST \
            -F "payload_json=<$PAYLOAD_FILE;type=application/json" \
            "${FILE_ARGS[@]}" \
            "$WEBHOOK_URL" \
            --fail \
            --silent \
            --show-error
          # DS14-Soyuz-end
