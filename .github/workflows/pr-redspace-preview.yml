name: PR Redspace Preview

on:
  # DS14-start: run only after the PR RSI validator workflow completes.
  workflow_run:
    workflows:
      - RSI Validator
    types:
      - completed
  # DS14-end
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    name: Build Preview
    runs-on: ubuntu-latest
    # DS14-start: only build for pull_request RSI validator runs or manual dispatches.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.name == 'RSI Validator'
      )
    # DS14-end
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve PR context
        # DS14-start: recover PR metadata from the finished RSI validator run.
        if: github.event_name == 'workflow_run'
        id: pr_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > pr.json
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base.sha' pr.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' pr.json)" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(jq -r '.head.repo.clone_url' pr.json)" >> "$GITHUB_OUTPUT"
        # DS14-end

      - name: Fetch PR head commit
        # DS14: workflow_run provides the validated PR head repository and SHA.
        if: github.event_name == 'workflow_run'
        env:
          HEAD_REPO: ${{ steps.pr_context.outputs.head_repo }}
          HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
        run: |
          git fetch --no-tags "$HEAD_REPO" "$HEAD_SHA"

      - name: Resolve comparison base
        id: compare_base
        env:
          # DS14: workflow_run uses the PR that triggered RSI validation.
          BASE_SHA: ${{ github.event_name == 'workflow_run' && steps.pr_context.outputs.base_sha || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && steps.pr_context.outputs.head_sha || github.sha }}
        run: |
          COMPARE_BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "base_sha=$COMPARE_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Render preview image
        id: render
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .artifacts
          python Tools/pr_redspace_preview.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output .artifacts/pr-redspace-preview.png \
            --metadata .artifacts/pr-redspace-preview.json
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-redspace-preview
          path: |
            .artifacts/pr-redspace-preview.png
            .artifacts/pr-redspace-preview.json

      - name: Publish preview image to preview branch
        if: github.event_name == 'workflow_run'
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr_context.outputs.number }}
          HEAD_SHA: ${{ steps.render.outputs.head_sha }}
        run: |
          set -euo pipefail
          BRANCH="pr-preview-artifacts"
          IMAGE_PATH="pr/${PR_NUMBER}/redspace-before-after.png"
          TMP_DIR="$(mktemp -d)"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"

          git init "$TMP_DIR"
          cd "$TMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REMOTE_URL"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -b "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git commit --allow-empty -m "Initialize preview branch"
            git push origin "$BRANCH"
          fi

          mkdir -p "$(dirname "$IMAGE_PATH")"
          cp "$GITHUB_WORKSPACE/.artifacts/pr-redspace-preview.png" "$IMAGE_PATH"
          git add "$IMAGE_PATH"

          if ! git diff --cached --quiet; then
            git commit -m "Update PR #${PR_NUMBER} redspace preview"
            git push origin "$BRANCH"
          fi

          RAW_URL="https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/${IMAGE_PATH}?sha=${HEAD_SHA}"
          echo "image_url=$RAW_URL" >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        if: github.event_name == 'workflow_run'
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.pr_context.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-redspace-preview-comment -->'

      - name: Create or update preview comment
        if: github.event_name == 'workflow_run'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr_context.outputs.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-redspace-preview-comment -->
            ### Bluespace -> Redspace Preview
            Compared `${{ steps.render.outputs.base_sha }}` -> `${{ steps.render.outputs.head_sha }}`.

            ![PR redspace preview](${{ steps.publish.outputs.image_url }})

            [Open full-size image](${{ steps.publish.outputs.image_url }})
