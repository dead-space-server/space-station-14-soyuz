name: "Roadmap: Update roadmap status"

on:
  pull_request_target:
    types: [closed]

jobs:
  Update-roadmap-status:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract PR description
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BODY=$(printf '%s' "$PR_BODY" | base64 -w0)
          echo "DESCRIPTION_B64=$BODY" >> $GITHUB_OUTPUT
        
      - name: Parse PR description and update
        env:
          DESCRIPTION_B64: ${{ steps.extract.outputs.DESCRIPTION_B64 }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python <<'EOF'
          import yaml, re, os, base64

          ROADMAP = "Resources/Protoypes/_DeadSpace/_Soyuz/roadmap.yml"

          desc_b64 = os.environ.get("DESCRIPTION_B64", "")
          desc = base64.b64decode(desc_b64).decode("utf-8", errors="replace")
          desc = re.sub(r'<!--.*?-->', '', desc, flags=re.DOTALL)

          if ":world_map:" not in desc:
              print("Нет :world_map: — пропуск")
              exit(0)
          
          