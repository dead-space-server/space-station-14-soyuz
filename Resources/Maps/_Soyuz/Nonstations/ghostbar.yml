      parent: 2
    - type: Paper
      content: >-
        [italic]Я не понимаю, что это за место. За всю свою жизнь я не видел подобного. Остров движется в космосе на огромной скорости, но вместе с тем тут есть и атмосфера, и гравитация. 


        Но когда я соорудил подобие магнитных сапог, и случайно оказался в "космосе", я остался на месте, и мог спокойно ходить, словно под моими ногами была твёрдая поверхность. [bold]Это странно.. Очень странно.[/bold] Мне это не нравится. Возможно, это всё иллюзия... [bold]Никакого космоса нет и вовсе..[/bold] Но черт возьми, даже если так, сиё место выглядит волшебно.


        Синяя трава.. Такую я нигде не видел, на вкус как обычная, каких-либо необычных свойств я не выявил. Местные постройки выглядят так, словно их постоянно обслуживают. Пройдясь т-лучевым сканером по паре построек, я обнаружил проводку.. Но лишь одного типа. Нв кабели, подключенные к ЛКП.. А электричество в ЛКП кажись берётся из воздуха. Другого обьяснения у меня нет. Это не поддаётся любым законам обычного мира. [/italic]
