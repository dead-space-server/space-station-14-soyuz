  - uid: 1133
    components:
    - type: MetaData
      name: оборванная страница
    - type: Transform
      pos: -20.706842,-12.377333
      parent: 2
    - type: Paper
      content: >-
        [italic]...


        Я оказался не единственным здесь. Не первым, и не последним. За время моего пребывания, самые разные гуманоиды приходили, и уходили. Люди, унатхи, кобольды, дварфы, вульпы, фелениды, дионы, и прочие. Все они разные, и каждый по своему был уникален. 


        Однажды в этом месте появился вокс. А вместе с ним, и канистра азота для него, так как атмосфера сиего острова не была адаптирована под дышащих азотом.. Однажды, эксперимента ради, мы попытались узнать сколько молей азота примерно там есть. Оказалось, что до тех пор, пока насос включен, азот в канистре будет постоянно пополняться.. [/italic]
