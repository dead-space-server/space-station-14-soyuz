  mapName: 'Генеральный Штаб' #DS14-Soyuz local
  mapPath: /Maps/_Soyuz/centcomm.yml
  minPlayers: 10
  stations:
    centcomm:
      stationProto: NanotrasenCentralCommand
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Генеральный Штаб {1}' #DS14-Soyuz local
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
