- type: entity
  name: садовая лопата
  parent: BaseItem
  id: HydroponicsToolShovel
  description: Большая садовая лопата для выкапывания грядок.
  components:
  - type: Sprite
    sprite: Objects/Tools/shovel.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 14
    soundHit:
      collection: MetalThud
  - type: Item
    size: Normal
    sprite: Objects/Tools/shovel.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Wood: 50
  - type: StaticPrice
    price: 25
  - type: GardenShovel
    collisionMask: FullTileMask
    availableTiles:
      - FloorMowedAstroGrass
      - FloorJungleAstroGrass
      - FloorAstroGrass
      - FloorPlanetGrass
      - FloorGrassDark
      - FloorGrass
      - FloorGrassJungle
      - FloorPlanetDirt
      - FloorGrassLight
