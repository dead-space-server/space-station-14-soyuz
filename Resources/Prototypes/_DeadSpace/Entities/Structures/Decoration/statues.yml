- type: entity
  id: StatueAngel
  parent: BaseStructure
  name: статуя ангела
  description: Статуя из чёрного мрамора, изображающая мрачного ангела.
  components:
  # DS14-Soyuz-start
  - type: Construction
    graph: SoyuzStatueAngel
    node: decor
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # DS14-Soyuz-end
  - type: Sprite
    noRot: true
    sprite: _DeadSpace/Structures/Decoration/statues.rsi
    state: angel
    drawdepth: Mobs
    offset: "0.0,0.5"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.10,0.25,0.40"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  id: StatueThemis
