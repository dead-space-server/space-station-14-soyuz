  # DS14-Soyuz-start
  - type: Construction
    graph: SoyuzStatueThemis
    node: decor
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # DS14-Soyuz-end
  - type: Sprite
    noRot: true
    sprite: _DeadSpace/Structures/Decoration/statues3264.rsi
    state: themis
    drawdepth: Mobs
    offset: "0.0,0.5"
