# Wall Rock (Regular)
- type: entity
  id: WallRockBluespace
  parent: WallRock
  description: An ore vein rich with bluespace crystals.
  suffix: Bluespace
  components:
  - type: EntityRemap
    mask:
      AsteroidRock: AsteroidRockBluespace
      WallRockBasalt: WallRockBasaltBluespace
      WallRockChromite: WallRockChromiteBluespace
      WallRockSand: WallRockSandBluespace
      WallRockSnow: WallRockSnowBluespace
  - type: OreVein
    oreChance: 1.0
    currentOre: OreBluespace
  - type: Sprite
    layers:
    - state: rock
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_west
    - state: rock_bluespace
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

