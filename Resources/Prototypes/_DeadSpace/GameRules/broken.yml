- type: entity
  id: BrokenTechEvent
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: BrokenTechGameRule
    listComponent:
      - componentName: Apc
        minuteMin: 60 #DS14-Soyuz
        minuteMax: 90 #DS14-Soyuz
        howMuchEntity: 2
        chance: 15 #DS14-Soyuz
        action: !type:ExplodeEntityAction
          spawnTable: !type:EntSelector
            id: FireNRFHELL
            amount: 2
          spawnOffset: "0,0"
          explosionIntensity: 1
          explosionType: Default
      - componentName: NodeContainer
        minuteMin: 30 #DS14-Soyuz
        minuteMax: 60 #DS14-Soyuz
        howMuchEntity: 15
        chance: 25 #DS14-Soyuz
        action: !type:BlockWorkingEntityAction
          spawnTable: !type:EntSelector
            id: EffectSparksBrokenEvent
            amount: 1
          spawnOffset: "0,0"
          useEntityRotation: false
      - componentName: ApcPowerReceiver
        blacklistPrototypes:
          - ResearchAndDevelopmentServer
          - CrewMonitoringServer
          - PlayerStationAi
          - ResearchAndDevelopmentServerTaipan
          - GravityGenerator
          - GravityGeneratorMini
          - StationAnchor
          - StationAnchorOff
          - TegCirculator
          - TegCenter
        # blacklistTags:
        #   - HighRiskItem
        minuteMin: 30 #DS14-Soyuz
        minuteMax: 50 #DS14-Soyuz
        howMuchEntity: 15
        chance: 25 #DS14-Soyuz
        action: !type:BlockWorkingEntityAction
          spawnTable: !type:EntSelector
            id: EffectSparksBrokenEvent
            amount: 1
          spawnOffset: "0,0"
          useEntityRotation: false
