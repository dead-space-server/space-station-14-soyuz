# Leader
## Amber
- type: job
  id: ERTLeaderAmber
  name: job-name-ertleader-amber
  description: job-description-ertleader
  playTimeTracker: JobERTLeaderAmber
  setPreference: false
  requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 144000 # 40 hours
    - !type:DepartmentTimeRequirement
      department: Security
      time: 288000 # 80 hours
    - !type:DepartmentTimeRequirement
      department: Command
      time: 144000 # 40 hours
    - !type:OverallPlaytimeRequirement
      time: 1944000 # 540 hours
  startingGear: ERTLeaderGearAmber
  icon: "JobIconERTLeader"
  supervisors: job-supervisors-centcom
  canBeAntag: false
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  - ErtTeamLeader
  - NKVB # DS14-Soyuz
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant ]
#DS14-Soyuz-start
  - !type:AddComponentSpecial
    components:
    - type: Callsign
      base: Эмбер
      isHead: true
#DS14-Soyuz-end
  ranks:
    NKVBRankCaptain:
    - !type:RoleTimeRequirement
      role: JobERTLeaderAmber
      time: 108000 # 30 hours
    NKVBRankSeniorLieutenant:
    - !type:RoleTimeRequirement
      role: JobERTLeaderAmber
      time: 54000 # 15 hours
    NKVBRankLieutenant: []
#DS14-Soyuz-end

- type: startingGear
  id: ERTLeaderGearAmber
  equipment:
    jumpsuit: ClothingUniformJumpsuitERTLeader
    back: ClothingBackpackRIGERTLeader
    mask: ClothingMaskGasERT
    eyes: ClothingEyesHudERT
    ears: ClothingHeadsetAltAERT
    neck: ClothingNeckMantleERTLeader
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterArmorBulletproof
    suitstorage: WeaponDisablerSMG
    shoes: ClothingShoesBootsMagHos
    head: ClothingHeadHelmetERTLeader
    id: ERTLeaderPDA
    belt: ClothingBeltMilitaryWebbingERT
    pocket1: DoubleEmergencyOxygenTankFilled
    pocket2: FlashlightSeclite
  storage:
    back:
    - ERTloadoutAmberPrimary
    - ERTloadoutAmberSecondary
    - PinpointerNuclear
    - BoxCardboardERT
    - JawsOfLife
    - PortableCameraMonitor
    - CriminalRecordsMonitor
    - HandheldCrewMonitor
    - MedkitCombatFilled
    - EvacZoneTabletSobr # DS14-Soyuz    

