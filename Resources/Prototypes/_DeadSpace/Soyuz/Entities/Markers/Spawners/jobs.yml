- type: entity
  id: SpawnPointJobBase
  parent: MarkerBase
  abstract: true
  suffix: Job Spawn
  components:
  - type: SpawnPoint
    spawn_type: Job
  - type: Sprite
    sprite: Markers/jobs.rsi

- type: entity
  id: SpawnPointPolitkom
  parent: SpawnPointJobBase
  name: политический комиссар
  components:
  - type: SpawnPoint
    job_id: PolitKom
  - type: Sprite
    layers:
      - state: green
      - state: Politkom

- type: entity
  id: SpawnPointPolitruk
  parent: SpawnPointJobBase
  name: политический руководитель
  components:
  - type: SpawnPoint
    job_id: PolitRuk
  - type: Sprite
    layers:
      - state: green
      - state: Politruk