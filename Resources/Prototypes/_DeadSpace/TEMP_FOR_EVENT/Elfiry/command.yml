- type: entity
  id: ElfiryEventCommandTablet
  parent: BaseItem
  name: планшет командования «Рассвета»
  description: Полевой терминал управления отрядами. Принимает распоряжения назначенного командира.
  suffix: Обратный путь
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    state: syndie
  - type: Item
    size: Small
    sprite: Objects/Devices/tablets.rsi
    inhandVisuals:
      left:
      - state: inhand-left-syndie
      right:
      - state: inhand-right-syndie
  - type: EventCommandTablet
  - type: ActivatableUI
    key: enum.EventCommandUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.EventCommandUiKey.Key:
        type: EventCommandBoundUserInterface

- type: entity
  id: ElfiryEventCommander
  parent: BaseMobHuman
  name: командир «Рассвета»
  description: Командир передового отряда «Рассвета».
  suffix: Обратный путь, роль игрока
  components:
  - type: EventCommander
  - type: NpcFactionMember
    factions: [Syndicate]
  - type: Loadout
    prototypes: [ElfiryEventCommanderGear]
  - type: GhostRole
    name: elfiry-command-ghost-name
    description: elfiry-command-ghost-description
    rules: elfiry-command-ghost-rules
  - type: GhostTakeoverAvailable

- type: startingGear
  id: ElfiryEventCommanderGear
  parent: SyndicateFootsoldierGearRuin
  equipment:
    pocket2: ElfiryEventCommandTablet

