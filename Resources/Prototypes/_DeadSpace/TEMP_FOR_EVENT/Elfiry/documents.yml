- type: entity
  id: EventHomewardDocumentBase
  parent: BaseItem
  abstract: true
  suffix: Обратный путь
  description: Полевой документ со следами сгибов и служебными пометками.
  components:
  - type: Item
    size: Tiny
    sprite: Objects/Misc/bureaucracy.rsi
    inhandVisuals:
      left:
      - state: paper-inhand-left
      right:
      - state: paper-inhand-right
  - type: Tag
    tags:
    - Document
    - HighRiskItem
  - type: Godmode
  - type: Paper
    editingDisabled: true
    contentSize: 0
    signatures:
    - ' '
  - type: PaperVisuals
    headerImagePath: /Textures/_DeadSpace/TEMP_FOR_EVENT/Elfiry/Homeward/pages/ov01.png
    backgroundModulate: '#e8e3d5'
    maxWritableArea: 500, 680
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Appearance
  - type: Sprite
    sprite: _DeadSpace/TEMP_FOR_EVENT/Elfiry/Homeward/documents.rsi
    layers:
    - state: worn
    - sprite: Objects/Misc/bureaucracy.rsi
      state: paper_words
      map:
      - enum.PaperVisualLayers.Writing
      color: '#FFFFFF00'
      visible: false
    - sprite: Objects/Misc/bureaucracy.rsi
      state: paper_stamp-generic
      map:
      - enum.PaperVisualLayers.Stamp
      color: '#FFFFFF00'
      visible: false
- type: entity
