- type: entity
  parent: BaseItem
  id: PlantAnalyzer
  name: plant analyzer
  description: A scanner used to evaluate a plant's various areas of growth, genetic traits and chemicals.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Hydroponics/plant_analyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    storedRotation: -90
  - type: UserInterface
    interfaces:
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface
  - type: ItemToggle
    onUse: false
  - type: PlantAnalyzer
  - type: GuideHelp
    guides:
    - Botany
    - Chemicals

- type: latheRecipe
  parent: HandheldHealthAnalyzer
  id: PlantAnalyzer
  result: PlantAnalyzer

- type: latheRecipePack
  id: SoyuzBotanyProtolatheStatic
  recipes:
  - PlantAnalyzer
