  name: reagent-name-everyspice
  group: Foods
  desc: reagent-desc-everyspice
  physicalDesc: reagent-physical-desc-powdery
  flavor: spices
  flavorMinimum: 0.05
  color: "#7a481f"
  recognizable: true

- type: reagent
  id: ButterfliesBiggerReagent
  name: reagent-name-butterfliesbigger
  group: Toxins
  desc: reagent-desc-butterfliesbigger
  physicalDesc: reagent-physical-desc-reallynervous
  flavor: sweet
  color: "#c0992e"
  metabolisms:
    Poison:
      effects:
      - !type:PopupMessage
        type: Local
        messages:
        - butterflies-effect-stomach
        - butterflies-effect-looks
        - butterflies-effect-heart
        - butterflies-effect-exciting
        - butterflies-effect-hands
        - butterflies-effect-chaos
        - butterflies-effect-chaos-two
        - butterflies-effect-chaos-three
        probability: 0.4

- type: reagent
  id: DevilJuice
  name: reagent-name-devil-juice
  group: Toxins
  desc: reagent-desc-devil-juice
  physicalDesc: reagent-physical-desc-devil-juice
  flavor: bitter
  color: "#66181a"
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1.5
            Cellular: 1

- type: reagent
  id: Honey
  name: reagent-name-honey
  group: Foods
  desc: reagent-desc-honey
  physicalDesc: reagent-physical-desc-gloopy
  flavor: honey
  flavorMinimum: 0.05
  color: "#e79a3f"
  viscosity: 0.5
  recognizable: true
  metabolisms:
    Food:
      effects:
      - !type:Satiate
        satiationType: Hunger
        factor: 1
  footstepSound:
    collection: FootstepSticky
    params:
      volume: 6

- type: reagent
  id: JuicePomegranate
  name: reagent-name-juice-pomegranate
  parent: BaseJuice
  desc: reagent-desc-juice-pomegranate
  physicalDesc: reagent-physical-desc-crisp
  flavor: fruity
  color: "#a8151a"
  recognizable: true

- type: reagent
  id: NevcottaPowder
  name: reagent-name-nevcottapowder
  group: Toxins
  desc: reagent-desc-nevcottapowder
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#faf9f6"
  metabolisms:
    Poison:
      metabolismRate: 0.05
      effects:
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: NevcottaPowder
          min: 10
        probability: 0.15
      - !type:HealthChange
        damage:
          types:
            Poison: 2
            Asphyxiation: 0.25
      - !type:ModifyParalysis
        probability: 0.05
        time: 2

- type: reagent
  id: Negacordrazine
  name: reagent-name-negacordrazine
  group: Medicine
  desc: reagent-desc-negacordrazine
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#d34b26"
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        conditions:
        - !type:TotalDamageCondition
          min: 30
        damage:
          types:
            Asphyxiation: -1
            Bloodloss: -1
            Blunt: -0.4
            Slash: -0.4
            Piercing: -0.4
            Heat: -0.4
            Shock: -0.4
            Cold: -0.4
            Caustic: -0.4
            Poison: -1
            Radiation: -1

- type: constructionGraph
  id: Everyspice
  start: start
  graph:
  - node: start
