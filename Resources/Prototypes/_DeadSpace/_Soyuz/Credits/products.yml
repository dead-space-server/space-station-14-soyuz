# durationDays    — срок в днях (не задан = навсегда). Повторная покупка действующего товара продлевает срок.
# cosmeticEntity  — предмет, который выдаётся в руку при появлении в раунде (если товар надет).
# jobs            — выдавать предмет только этим профессиям (не задано = всем).
# exclusiveGroup  — товары одной группы нельзя надеть одновременно.
# color           — hex-цвет для товаров типа OocColor.
# permanent       — true: товар всегда надет и не снимается (пример: permanent: true).
# Цвет OOC всегда один: товары типа OocColor взаимоисключающие, даже без exclusiveGroup.

