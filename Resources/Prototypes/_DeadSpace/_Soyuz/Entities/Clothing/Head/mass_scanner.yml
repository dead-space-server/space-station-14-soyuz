- type: entity
  id: BaseHardsuitHelmetMassScanner
  abstract: true
  components:
  - type: RadarConsole
    maxRange: 342
    followEntity: true
    advanced: true
    allowedComponents:
    - component: Projectile
      color: "#FF0000"
    - component: MobState
      color: "#FFFFFF"
    - component: Item
      color: "#FFD700"
    blacklistComponents:
    - CartridgeAmmo
    - Dragon
    blacklistTags:
    - Ore
    - Trash
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: ActionGrant
    actions:
    - ActionHardsuitHelmetMassScanner
  - type: ItemActionGrant
    actions:
    - ActionHardsuitHelmetMassScanner
    activeIfWorn: true

- type: entity
  parent: ActionPAIMassScanner
  id: ActionHardsuitHelmetMassScanner
  name: Встроенный блюспейс-сканер масс
  description: Открыть блюспейс-сканер масс, встроенный в шлем скафандра.
