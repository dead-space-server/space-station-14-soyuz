- type: entity
  id: BaseHardsuitHelmetMassScanner
  abstract: true
  components:
  - type: RadarConsole
    maxRange: 256
    followEntity: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: ActionGrant
    actions:
    - ActionHardsuitHelmetMassScanner
  - type: ItemActionGrant
    actions:
    - ActionHardsuitHelmetMassScanner
    activeIfWorn: true

- type: entity
  parent: ActionPAIMassScanner
  id: ActionHardsuitHelmetMassScanner
  name: Встроенный сканер масс
  description: Открыть сканер масс, встроенный в шлем скафандра.
