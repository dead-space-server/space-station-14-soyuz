# Шаблоны
- type: entity
  parent: [ BaseCentcommContraband, ClothingHeadHelmetHardsuitERTLeader, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitNavyBase
  name: базовый шлем ВКФ СССП
  description: Глядя на его фонарик вам хочется рыдать.
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/Head/Hardsuits/nanotrasen_navy_captain.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/Head/Hardsuits/nanotrasen_navy_captain.rsi
  - type: ClothingGrantComponent
    component: 
      - type: ImmunNecroobelisk
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
        Radiation: 0.90
        Caustic: 0.95
        Poison: 0.90
  - type: PointLight
    color: "#00FFFF"
    radius: 7
    energy: 5
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

