- type: entity
  parent:  
  id: SoyuzClothingOuterArmorBase
  name: базовая броня великого союза
  description: Слава умывальнику.
  abstract: true
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
  - type: StaminaResistance
    damageCoefficient: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/armor_rustle/plate_armor_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/armor_rustle/plate_armor_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/armor_rustle/plate_armor_drop.ogg
  - type: IgnoreContentsSize
    items:
      components:
      - OuterClothingAccessory
  - type: OuterClothingAccessoryHolder
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Tiny
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface