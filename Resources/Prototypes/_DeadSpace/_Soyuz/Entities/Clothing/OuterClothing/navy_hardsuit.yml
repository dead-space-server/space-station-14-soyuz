  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/nanotrasen_navy_medical.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/nanotrasen_navy_medical.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: FireProtection
    reduction: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Poison: 0.1
        Piercing: 0.35
        Heat: 0.3
        Cold: 0.3
        Shock: 0.3
        Radiation: 0.4
        Caustic: 0.1
        Stun: 0.2
  - type: Reflect
    reflectProb: 0.1
  - type: VirusResistance
    virusResistanceCoefficient: 1
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitNavyMedical

