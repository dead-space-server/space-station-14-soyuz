# Скафандры

- type: entity
  parent: [ BaseCentcommContraband, ClothingOuterHardsuitBase ]
  id: ClothingOuterHardsuitRepairOrderEngineer
  name: скафандр ремонтной бригады
  description: Защитный скафандр ремонтной службы СССП для восстановления аварийных станций и повреждённых шаттлов. Оснащён креплением для дыхательного баллона. Усиленная радиационная и взрывная защита помогает работать там, где обычный ремонт заканчивается эвакуацией.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/repair_order_engineer.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/repair_order_engineer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: StaminaResistance
    damageCoefficient: 0.8
  - type: Tag
    tags: []
  - type: ExplosionResistance
    damageCoefficient: 0.1
  - type: FireProtection
    reduction: 1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.5
        Shock: 0.8
        Radiation: 0.1
        Caustic: 0.5
  - type: VirusResistance
    virusResistanceCoefficient: 0.6
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.6
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitRepairOrderEngineer
  - type: AllowSuitStorage
    whitelist:
      components:
      - GasTank

- type: entity
  parent: [ BaseCentcommContraband, ClothingOuterHardsuitBase ]
  id: ClothingOuterHardsuitMedicalOrderMedic
  name: скафандр медицинской эвакуации
  description: Скафандр медицинской эвакуационной службы СССП для оказания помощи и перевозки пострадавших из опасных зон. Внутренние отделения вмещают лекарства и медицинские инструменты. Лёгкие приводы и химическая защита позволяют быстро добраться до пациента и вынести его к спасательному шаттлу.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/medical_order_medic.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/medical_order_medic.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: FireProtection
    reduction: 0.5
  - type: StaminaResistance
    damageCoefficient: 0.8
  - type: Tag
    tags: []
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Poison: 0.6
        Heat: 0.8
        Shock: 0.9
        Radiation: 0.6
        Caustic: 0.7
  - type: VirusResistance
    virusResistanceCoefficient: 0.05
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.25
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.05
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitMedicalOrderMedic
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Normal
    whitelist:
      tags:
      - Bottle
      - Spray
      - Brutepack
      - Bloodpack
      - Gauze
      - Ointment
      - Tourniquet
      - PillCanister
      - DiscreteHealthAnalyzer
      - SurgeryTool
      - Dropper
      - Medkit
      - CompactDefibrillator
      - Nanopaste
      - Syringe
      - Hypospray
      components:
      - Injector
      - Pill
      - HealthAnalyzer
      - Defibrillator
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
