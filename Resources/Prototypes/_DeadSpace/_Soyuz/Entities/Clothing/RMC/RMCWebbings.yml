- type: entity
  parent: SoyuzWebbingDropPouch
  id: SoyuzWebbingDropPouchRMC
  name: подсумок королевского морпеха
  description: A convenient pouch to carry loose items around.
  components:
    - type: Sprite
      sprite: _DeadSpace/_Soyuz/Clothing/RMC/webbings/droppouch.rsi
      state: webbing
    - type: Webbing
      playerSprite:
        sprite: _DeadSpace/_Soyuz/Clothing/RMC/webbings/droppouch.rsi
        state: equipped
      components:
        - type: Storage
          maxItemSize: Normal
          grid:
            - 0,0,7,1   # up to 4 small or 8 tiny items
        - type: ExplosionResistance
          damageCoefficient: 0
          worn: false
        - type: StoreAfterFailedInteract

- type: entity
  parent: SoyuzWebbingAdminPouch
  id: SoyuzWebbingAdminPouchRMC
  name: royal marine admin pouch
  description: A pouch to carry your administrative equipment around.
  components:
    - type: Sprite
      sprite: _DeadSpace/_Soyuz/Clothing/RMC/webbings/adminpouch.rsi
      state: webbing
    - type: Webbing
      playerSprite:
        sprite: _DeadSpace/_Soyuz/Clothing/RMC/webbings/adminpouch.rsi
        state: equipped
      components:
        - type: Storage
          maxItemSize: Normal
          grid:
            - 0,0,2,1   # up to 4 small or 8 tiny items
        - type: ExplosionResistance
          damageCoefficient: 0
          worn: false
        - type: StoreAfterFailedInteract
