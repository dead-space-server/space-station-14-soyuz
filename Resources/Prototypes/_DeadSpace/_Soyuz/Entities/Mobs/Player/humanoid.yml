# Navy
## Captain
- type: entity
  id: RandomHumanoidSpawnerNavyCaptain
  name: капитан ВКФ
  components:
    - type: Sprite
      sprite: _DeadSpace/_Soyuz/Markers/jobs.rsi
      state: nanotrasen_navy_captain
    - type: RandomMetadata
      nameSegments:
      - NamesFirstNavyCaptain
      - NamesLastNavy
      nameFormat: name-format-ert
    - type: RandomHumanoidSpawner
      settings: NavyCaptain

- type: randomHumanoidSettings
  id: NavyCaptain
  parent: EventHumanoidERTZombieImmune
  components:
    - type: GhostRole
      name: ghost-role-information-navy-captain-name
      description: ghost-role-information-navy-captain-description
      rules: ghost-role-information-nonantagonist-rules
      category: ghost-role-information-navy-category
      requirements:
        - !type:DepartmentTimeRequirement
          department: Medical
          time: 36000 # 10 hours
        - !type:DepartmentTimeRequirement
          department: Security
          time: 72000 # 20 hours
        - !type:DepartmentTimeRequirement
          department: Command
          time: 36000 # 10 hours
      raffle:
        settings: short
      job: NavyCaptain
    - type: Loadout
      prototypes: [ NavyCaptainGear ]
    - type: RandomMetadata
      nameSegments:
      - NamesFirstNavyCaptain
      - NamesLastNavy
      nameFormat: name-format-ert

