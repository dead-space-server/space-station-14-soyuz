- type: entity
  parent: FoodMeat
  id: FoodSoyMeat
  name: soy meat
  description: A plant-based meat substitute made from soybeans.
  components:
  - type: FlavorProfile
    flavors:
    - soy
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Consumable/Food/soy_meat.rsi
    state: plain
  - type: Item
    sprite: _DeadSpace/_Soyuz/Objects/Consumable/Food/soy_meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 5
  - type: SliceableFood
    slice: FoodSoyMeatCutlet
  - type: RotInto
    entity: FoodSoyMeatRotten
  - type: SoyFood
    ingredient: FoodMeat

- type: entity
  parent: FoodMeatCutlet
  id: FoodSoyMeatCutlet
  name: soy meat cutlet
  description: A slice of plant-based soy meat.
  components:
  - type: FlavorProfile
    flavors:
    - soy
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Consumable/Food/soy_meat.rsi
    state: cutlet
  - type: Item
    sprite: _DeadSpace/_Soyuz/Objects/Consumable/Food/soy_meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 2
  - type: SoyFood
    ingredient: FoodMeatCutlet

- type: entity
  parent: FoodMeatRotten
  id: FoodSoyMeatRotten
  name: rotten soy meat
  description: Even plant-based meat does not keep forever.
  components:
  - type: FlavorProfile
    flavors:
    - soy
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: GastroToxin
          Quantity: 4
        - ReagentId: Fat
          Quantity: 4
  - type: SoyFood
    ingredient: FoodMeatRotten
