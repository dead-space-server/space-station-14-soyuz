- type: entity
  parent: BasePDA
  id: SoyuzBaseWidePDA
  abstract: true
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay_wide"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay_wide"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false

- type: entity
  parent: BasePDA
  id: SoyuzBasePDA
  abstract: true
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false


- type: entity
  parent: SoyuzBaseWidePDA
  id: PolitrukPDA
  name: КПК Политического Руководителя
  description: Скромный, алый как Советской флаг, КПК Политического руководителя Управления ПолитКонтроля НКВБ. В нем довольно много записей о разного рода коммунизме. Почему этот глаз смотрит вечно на тебя?
  components:
  - type: Pda
    id: PolitrukIDCard
    penSlot:
      startingItem: LuxuryPen
      priority: -1
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-politruk
  - type: PdaBorderColor
    borderColor: "#9b2d30"
  - type: Icon
    state: pda-politruk

