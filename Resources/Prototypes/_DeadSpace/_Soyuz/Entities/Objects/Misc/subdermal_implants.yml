  name: имплант "культурности"
  description: Этот имплант сделает вас более культурным.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: ComponentInjectorImplant
    targetComponents:
    - type: ReplacementAccent
      accent: NoSwearingAccent

- type: entity
