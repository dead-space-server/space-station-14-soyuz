# Cookware drawn for the Soyuz cooking system. Food and liquid insertion use
# a dedicated ingredient container and solution interactions.
- type: entity
  id: KitchenCookwareBase
  abstract: true
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Kitchen/pan.rsi
    state: icon
  - type: Item
    size: Normal
  - type: UserInterface
    interfaces:
      enum.CookingUiKey.Key:
        type: CookingBoundUserInterface
  - type: ContainerContainer
    containers:
      cooking: !type:Container
  - type: Temperature
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 300
  - type: RefillableSolution
    solution: cooker
  - type: DrainableSolution
    solution: cooker
  - type: Spillable
    solution: cooker
  - type: ExaminableSolution
    solution: cooker

- type: entity
  id: KitchenCookingPan
  parent: KitchenCookwareBase
  name: frying pan
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Kitchen/pan.rsi
    state: icon
  - type: CookingVessel
    method: Pan
    maxPortions: 2
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 120

