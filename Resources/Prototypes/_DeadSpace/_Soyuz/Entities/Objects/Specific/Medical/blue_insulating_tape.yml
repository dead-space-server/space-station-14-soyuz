- type: entity
  id: BlueInsulatingTape
  parent: BaseHealingItem
  name: blue insulating tape
  description: Insulating tape soaked with repair nanobots. Useful for patching windows, synthetics, and robots in the field.
  suffix: Full
  components:
  - type: Tag
    tags:
    - BlueInsulatingTape
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/blue_insulating_tape.rsi
    state: insulating_tape_blue-3
    layers:
    - state: insulating_tape_blue-3
      map: ["base"]
  - type: Item
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/blue_insulating_tape.rsi
    heldPrefix: insulating_tape_blue
  - type: WindowRepairTape
  - type: Healing
    damageContainers:
    - Silicon
    damage:
      types:
        Heat: -10
        Shock: -10
        Blunt: -10
        Slash: -10
        Piercing: -10
    healingBeginSound:
      path: /Audio/Items/Medical/ointment_begin.ogg
    healingEndSound:
      path: /Audio/Items/Medical/ointment_end.ogg
  - type: Stack
    stackType: BlueInsulatingTape
    count: 10
    baseLayer: base
    layerStates:
    - insulating_tape_blue-3
    - insulating_tape_blue-5
    - insulating_tape_blue-10
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [2, 4]
  - type: StackPrice
    price: 0
  - type: Appearance

