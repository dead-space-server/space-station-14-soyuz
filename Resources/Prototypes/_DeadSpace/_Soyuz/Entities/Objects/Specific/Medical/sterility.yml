# DS14-start
- type: entity
  id: SyringeDisposable
  parent: Syringe
  name: disposable syringe
  description: A single-use syringe that starts sterile inside an individual wrapper.
  components:
  - type: Icon
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    state: syringe
  - type: Sterility
    exposureInterval: 60
    exposurePerTick: 13.5
    perUseIncrease: 13.5

- type: entity
  id: SyringeDisposablePacked
  parent: BaseItem
  name: packed disposable syringe
  description: A sterile disposable syringe sealed in an individual wrapper.
  components:
  - type: Icon
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    state: syringe_packaging_ver2
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    state: syringe_packaging_ver2
  - type: Item
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    size: Tiny
  - type: DisposablePackage
    spawnInjectorProto: SyringeDisposable
    spawnTrashProto: SyringeDisposableTrash

- type: entity
  id: SyringeDisposableTrash
  parent: BaseItem
  name: sterile wrapper
  description: A discarded sterile wrapper from a disposable syringe.
  components:
  - type: Icon
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    state: syringe_packaging_open
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    state: syringe_packaging_open
  - type: Item
    sprite: _DeadSpace/_Soyuz/Objects/Specific/Medical/disposable_syringe.rsi
    size: Tiny
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

- type: entity
  id: BoxDisposableSyringe
  parent: BoxCardboard
  name: disposable syringe box
  description: A box filled with individually packed disposable syringes.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SyringeDisposablePacked
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: syringe
# DS14-end
