- type: entity
  id: KitchenCounter
  parent: BaseStructure
  name: kitchen counter
  description: A continuous work surface for the kitchen set.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Kitchen/counter.rsi
    state: state_0
    snapCardinals: true
  - type: IconSmooth
    key: kitchen_counters
    mode: CardinalFlags
    base: state_
  - type: Transform
    noRot: true
  - type: PlaceableSurface

- type: entity
  id: KitchenCounterCorner
  parent: KitchenCounter
  name: kitchen corner counter
  description: A corner section that turns toward adjoining kitchen modules.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Kitchen/counter_corner.rsi
    state: state_0
    snapCardinals: true
  - type: Transform
    noRot: true

- type: entity
  id: KitchenCounterSink
  parent: Sink
  name: kitchen counter sink
  description: The matching sink section of the kitchen set.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Kitchen/counter_sink.rsi
    layers:
    - state: state_0
    - state: icon
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    snapCardinals: true
  - type: Transform
    anchored: true
    noRot: true
  - type: IconSmooth
    key: kitchen_counters
    mode: CardinalFlags
    base: state_

- type: entity
  id: KitchenAssemblyCounter
  parent: KitchenCounter
  name: kitchen assembly counter
  description: A work surface with a board for assembling prepared food.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Kitchen/counter_assembly.rsi
    state: state_0
    snapCardinals: true
  - type: CookingVessel
    method: Assembly
    minimumTemperature: 0
  - type: CookingStation
    selfAppliance: PrepTable
  - type: UserInterface
    interfaces:
      enum.CookingUiKey.Key:
        type: CookingBoundUserInterface
  - type: ActivatableUI
    key: enum.CookingUiKey.Key
  - type: ContainerContainer
    containers:
      cooking: !type:Container
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 150
  - type: RefillableSolution
    solution: cooker
  - type: DrainableSolution
    solution: cooker
