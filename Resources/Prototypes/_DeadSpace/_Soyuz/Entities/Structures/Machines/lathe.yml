    - BasicRobotics
    - BasicAnomalousResearch
    - BasicXenoArcheology
    - AlternativeResearch
    - MagnetsTech
    - AnomalyCoreHarnessing
    - MechanicalCompression
    - CritterMechs
    # RND: Tier 2
    - ProcessingTungsten
