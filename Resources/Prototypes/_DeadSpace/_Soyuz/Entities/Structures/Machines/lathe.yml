- type: entity
  id: SoyuzRNDProtolathe
  parent: Protolathe
  name: исследовательский протолат
  description: Converts raw materials into advanced items.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Structures/Machines/techfab.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: sci
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: Machine
    board: ProtolatheMachineCircuitboard
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    dynamicPacks:
    - ScienceEquipment
    - ScienceExplosives
