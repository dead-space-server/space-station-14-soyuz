# DS14-start
- type: entity
  id: SyringeSterilizer
  parent: [ BaseMachinePowered, SmallConstructibleMachine ]
  name: syringe sterilizer
  description: Sterilizes syringes and hyposprays, and purges any solution left inside.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/diagnoser.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: [machineLayer]
    - state: unlit
      map: [terminalLayer]
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SyringeSterilizerVisuals.Status:
        machineLayer:
          Idle: { state: "icon" }
          Working: { state: "running" }
          Success: { state: "icon" }
        terminalLayer:
          Idle: { state: "unlit", shader: unshaded }
          Working: { state: "unlit", shader: unshaded }
          Success: { state: "successfully_unlit", shader: unshaded }
  - type: Machine
    board: SyringeSterilizerMachineCircuitboard
  - type: SyringeSterilizer
  - type: ContainerContainer
    containers:
      sterilizer_slot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ItemSlots
    slots:
      sterilizer_slot:
        whitelist:
          components:
          - Injector
          - Sterility

- type: entity
  id: SyringeSterilizerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: syringe sterilizer machine board
  description: A machine board for a syringe sterilizer.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SyringeSterilizer
    stackRequirements:
      Manipulator: 2
      Glass: 2
      Cable: 2
      Plastic: 2
# DS14-end
