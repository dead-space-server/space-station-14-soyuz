- type: entity
  parent: BaseComputerAiAccess
  id: TelecommunicationBlacklistComputer
  name: telecommunications blacklist console
  description: Controls station-local radio channel restrictions for crew members.
  components:
  - type: TelecommunicationBlacklistConsole
  - type: UserInterface
    interfaces:
      enum.TelecommunicationBlacklistConsoleUiKey.Key:
        type: TelecommunicationBlacklistConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.TelecommunicationBlacklistConsoleUiKey.Key
    singleUser: true
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#3c5eb5"
  - type: Computer
    board: TelecommunicationBlacklistComputerCircuitboard
  - type: AccessReader
    access: [["StationAi"], ["HeadOfPersonnel"], ["Captain"]]
  - type: Lock
    unlockOnClick: false

- type: entity
  parent: BaseComputerCircuitboard
  id: TelecommunicationBlacklistComputerCircuitboard
  name: telecommunications blacklist console board
  description: A computer printed circuit board for a telecommunications blacklist console.
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: TelecommunicationBlacklistComputer
