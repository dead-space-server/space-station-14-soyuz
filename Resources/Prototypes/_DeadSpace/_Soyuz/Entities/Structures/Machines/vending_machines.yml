  description: A wall-mounted dispenser loaded with individually packed disposable syringes.
  components:
  - type: Icon
    sprite: _DeadSpace/_Soyuz/Structures/Machines/sterility.rsi
    state: wall-icon
  - type: VendingMachine
    pack: NanoMedDisposableSyringeInventory
    offState: wall-icon
    brokenState: wall-icon
    normalState: wall-running
    denyState: wall-icon
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Structures/Machines/sterility.rsi
    layers:
    - state: wall-icon
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: wall-icon
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
  - type: AccessReader
    access: [["Medical"]]
# DS14-end
