- type: entity
  parent: Clothing
  id: ClothingUniformGhostBarBase
  name: космо-комбинезон
  description: Одежда, которую легально получить на станции, вряд ли получится.
  suffix: Гост-бар, Неснимаемая
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [innerclothing]
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: PhysicalComposition
    materialComposition:
      Cloth: 150
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: Unremoveable

- type: entity
  parent: ClothingUniformGhostBarBase
  id: ClothingUniformGhostBarBlue
  name: голубой космо-комбинезон
  components:
