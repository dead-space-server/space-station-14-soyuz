- type: entity
  id: GravityGeneratorInvisible
  parent: BaseMachinePowered
  name: гравитационная аномалия
  description: Вы её не увидите.
  suffix: Гравген, Для маппинга
  placement:
    mode: AlignTileAny
  components:
  - type: Sprite
    sprite: Structures/Machines/gravity_generator_mini.rsi
    snapCardinals: true
    layers:
      - state: on
        map: ["enum.GravityGeneratorVisualLayers.Base"]
      - sprite: Structures/Machines/gravity_generator_core.rsi
        state: activated
        shader: unshaded
        map: ["enum.GravityGeneratorVisualLayers.Core"]
        scale: "0.4,0.4"
        offset: "0,0.2"
  - type: GravityGenerator
    lightRadiusMin: 0.75
    lightRadiusMax: 2.5
    spriteMap:
      broken: "broken"
      unpowered: "off"
      off: "off"
      on: "on"
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,1.5,1.5"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Stealth
    minVisibility: -1
    maxVisibility: -1
  - type: ApcPowerReceiver
    powerLoad: 2
  - type: PowerCharge
    idlePower: 1
    activePower: 2

- type: entity
  id: StationAnchorInvisible
  parent: StationAnchorIndestructible
  name: магнитная аномалия
  description: Вы её не увидите.
  suffix: Якорь, Для маппинга
  components:
  - type: Physics
    canCollide: false
  - type: Stealth
    minVisibility: -1
    maxVisibility: -1
