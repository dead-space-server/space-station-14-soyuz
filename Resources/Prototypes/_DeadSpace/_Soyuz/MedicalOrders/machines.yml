- type: entity
  abstract: true
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: SoyuzMedicalOrderMachineBase
  placement:
    mode: SnapgridCenter
  components:
  - type: WiresPanel
  - type: ActivatableUI
    key: enum.MedicalOrderUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.MedicalOrderUiKey.Key:
        type: MedicalOrderBoundUserInterface
  - type: AccessReader
    access: [["Medical"], ["Chemistry"], ["ChiefMedicalOfficer"]]
  - type: MedicalOrderMachine
    config: SoyuzMedicalOrders
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Structures/Machines/MedicalOrders/medical_reagent_order_machine.rsi
    noRot: true
    offset: 0, 0.5
    layers:
    - state: icon
      map: [base]

- type: entity
  parent: SoyuzMedicalOrderMachineBase
  id: SoyuzMedicalReagentOrderMachine
  name: pharmaceutical exchange terminal
  description: Buys approved medicines at market prices and delivers medical shop purchases.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Structures/Machines/MedicalOrders/medical_reagent_order_machine.rsi
  - type: MedicalOrderMachine
    kind: Reagent
  - type: Machine
    board: SoyuzMedicalReagentOrderMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beakerSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components:
          - FitsInDispenser

- type: entity
  parent: SoyuzMedicalOrderMachineBase
  id: SoyuzMedicalPatientReceiver
  name: casualty delivery capsule
  description: Delivers casualties to the station for treatment under medical contracts.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Structures/Machines/MedicalOrders/medical_patient_receiver.rsi
  - type: MedicalOrderMachine
    kind: PatientReceiver
  - type: Machine
    board: SoyuzMedicalPatientReceiverMachineCircuitboard
  - type: Construction
    containers:
    - machine_parts
    - machine_board
    - entity_storage
  - type: EmptyOnMachineDeconstruct
    containers:
    - entity_storage
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: EntityStorage
    capacity: 1
    maxSize: 2
    showContents: false
    openOnMove: false
    isCollidableWhenOpen: true
    enteringOffset: 0, -1
    enteringRange: 0.6
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container

- type: entity
  parent: SoyuzMedicalOrderMachineBase
  id: SoyuzMedicalPatientSender
  name: recovered patient evacuation capsule
  description: Checks recovered patients and evacuates them from the station after treatment.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Structures/Machines/MedicalOrders/medical_patient_sender.rsi
  - type: MedicalOrderMachine
    kind: PatientSender
  - type: Machine
    board: SoyuzMedicalPatientSenderMachineCircuitboard
  - type: Construction
    containers:
    - machine_parts
    - machine_board
    - entity_storage
  - type: EmptyOnMachineDeconstruct
    containers:
    - entity_storage
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: EntityStorage
    capacity: 1
    maxSize: 2
    showContents: false
    openOnMove: false
    isCollidableWhenOpen: true
    enteringOffset: 0, -1
    enteringRange: 0.6
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container

- type: entity
  parent: BaseMachineCircuitboard
  id: SoyuzMedicalReagentOrderMachineCircuitboard
  name: pharmaceutical exchange terminal machine board
  description: A machine board for a pharmaceutical exchange terminal.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SoyuzMedicalReagentOrderMachine
    stackRequirements:
      Manipulator: 1
      Glass: 1
      Cable: 1

- type: entity
  parent: BaseMachineCircuitboard
  id: SoyuzMedicalPatientReceiverMachineCircuitboard
  name: casualty delivery capsule machine board
  description: A machine board for a casualty delivery capsule.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SoyuzMedicalPatientReceiver
    stackRequirements:
      Manipulator: 1
      Glass: 5
      Cable: 1

- type: entity
  parent: BaseMachineCircuitboard
  id: SoyuzMedicalPatientSenderMachineCircuitboard
  name: recovered patient evacuation capsule machine board
  description: A machine board for a recovered patient evacuation capsule.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SoyuzMedicalPatientSender
    stackRequirements:
      Manipulator: 1
      Glass: 5
      Cable: 1
