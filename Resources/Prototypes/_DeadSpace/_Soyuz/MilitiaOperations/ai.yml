- type: htnCompound
  id: MilitiaCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Uncuff
  - preconditions:
    - !type:BuckledPrecondition
      isBuckled: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UnbuckleOperator
  - preconditions:
    - !type:PulledPrecondition
      isPulled: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UnPullOperator
  - preconditions:
    - !type:InContainerPrecondition
      isInContainer: true
    tasks:
    - !type:HTNCompoundTask
      task: EscapeCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Evade
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: WaitForTreatment
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: RefillMedicine
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: SelectTreatment
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: ApproachTreatment
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Treat
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Retreat
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Hold
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Reload
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Arm
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Squad
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MilitiaSupportOperator
        kind: Guard
