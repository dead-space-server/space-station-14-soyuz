- type: entity
  id: MilitiaOperationCombatMedicineBottle
  parent: [BaseChemistryBottleFilled, BaseSyndicateContraband]
  name: флакон боевого регенератора
  description: Препарат для лечения пулевых ранений и ожогов. На этикетке стоит маркировка полевой медицинской службы «Рассвета».
