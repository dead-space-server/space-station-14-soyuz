- type: entity
  id: MilitiaOperationCombatMedicineBottle
  parent: [BaseChemistryBottleFilled, BaseSyndicateContraband]
  name: флакон боевого регенератора
  description: Препарат для лечения пулевых ранений и ожогов. На этикетке стоит маркировка полевой медицинской службы «Рассвета».
  suffix: Деритрацин
  components:
  - type: Label
    currentLabel: reagent-name-derytracine
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Derytracine
          Quantity: 30

- type: entity
  id: MilitiaOperationHemostaticBottle
  parent: [BaseChemistryBottleFilled, BaseSyndicateContraband]
  name: флакон кровезамещающей смеси
  description: Полевая смесь для остановки кровотечения и восполнения крови. На этикетке указано - 10 единиц транексамовой кислоты и 20 единиц физраствора.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: TranexamicAcid
          Quantity: 10
        - ReagentId: Saline
          Quantity: 20

- type: entity
  id: MilitiaOperationHemostaticHypospray
  parent: SyndiHypo
  name: кровоостанавливающий гипоспрей
  description: Полевой гипоспрей с фильтром для физраствора и транексамовой кислоты.
  components:
  - type: Injector
    reagentWhitelist: [TranexamicAcid, Saline]

