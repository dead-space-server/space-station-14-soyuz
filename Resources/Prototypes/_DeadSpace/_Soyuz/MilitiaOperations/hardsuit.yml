- type: entity
  parent: ClothingOuterHardsuitPoliceBeta1
  id: ClothingOuterHardsuitMilitiaOperation
  name: скафандр оперативной группы «Рубеж»
  description: Штурмовой скафандр милиции СССП. Усиленная броня защищает при досмотре опасных судов, а фиксаторы перчаток удерживают предметы в руках при падении и оглушении. Фиксаторы не мешают добровольно отпустить оружие и отключаются при критическом состоянии владельца.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/militia_operation.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/OuterClothing/Hardsuits/militia_operation.rsi
  - type: Construction
    remove: true
  - type: MilitiaWeaponRetention
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: StaminaResistance
    damageCoefficient: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.4
        Heat: 0.5
        Shock: 0.8
        Radiation: 0.5
        Caustic: 0.6
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitMilitiaOperation
  - type: AllowSuitStorage
    whitelist:
      components:
      - GasTank

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: ClothingHeadHelmetHardsuitMilitiaOperation
  name: шлем скафандра «Рубеж»
  description: Герметичный шлем оперативной группы милиции СССП с фонарём и защищённым визором.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/Head/Hardsuits/militia_operation.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/Head/Hardsuits/militia_operation.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
        Radiation: 0.5
  - type: PressureProtection
    highPressureMultiplier: 0.08
  - type: FlashbangProtection
    reduction: 2
  - type: EyeProtection
  - type: PointLight
    color: "#FFE0B3"
    radius: 7
    energy: 5
