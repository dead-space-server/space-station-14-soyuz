- type: entity
  id: MilitiaOperationRaiderMedic
  suffix: Враждебный
  parent: MilitiaOperationRaiderBase
  name: полевой медик «Рассвета»
  description: Полевой медик штурмовой группы. Вооружён и обучен оказывать помощь под огнём.
  components:
