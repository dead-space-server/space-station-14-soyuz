- type: constructionGraph
  id: SoyuzFullFlagUSSP
  start: start
  graph:
  - node: start
    edges:
    - to: decor
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: MetalRod
        amount: 10
        doAfter: 2
      - material: Cloth
        amount: 4
        doAfter: 2
  - node: decor
    entity: FullFlagUSSP
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 10
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 4
      - !type:DeleteEntity {}
      steps:
      - tool: Cutting
        doAfter: 3
      - tool: Anchoring
        doAfter: 5

