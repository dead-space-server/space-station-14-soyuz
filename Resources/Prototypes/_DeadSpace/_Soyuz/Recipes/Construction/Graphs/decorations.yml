# Refunds use single-unit stack prototypes and DeleteEntity, without damage destruction.

- type: constructionGraph
  id: SoyuzBannerUSSP
  start: start
  graph:
  - node: start
    edges:
    - to: decor
      steps:
      - material: Steel
        amount: 2
        doAfter: 2
      - material: Cloth
        amount: 4
        doAfter: 2
  - node: decor
    entity: BannerUSSP
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 4
      - !type:DeleteEntity {}
      steps:
      - tool: Cutting
        doAfter: 3

