  name: repair-damage-atmoscompartmentfailure-name
  description: repair-damage-atmoscompartmentfailure-description
  weight: 1
  severity: Heavy
  placement: RepairValueTarget
  targets:
  - RepairAtmosControl
  - RepairAtmosProcessing
  - RepairAtmosPipe
  - RepairAtmosVent
  stages:
  - shape: Disc
    minRadius: 2
    maxRadius: 4
    minLength: 2
    maxLength: 4
    operations:
    - type: RemoveAnchoredEntitiesByRepairValueCategory
      chance: 1
      categories:
      - RepairAtmosControl
      - RepairAtmosProcessing
      - RepairAtmosPipe
      - RepairAtmosVent
  - shape: Disc
    minRadius: 1
    maxRadius: 2
    minLength: 2
    maxLength: 4
    operations:
    - type: RemoveAnchoredEntitiesByRepairValueCategory
      chance: 0.25
      categories:
      - RepairWall
      - RepairReinforcedWall
      - RepairHull
      - RepairHeavyWall
      - RepairArmoredWall
      - RepairWindow
      - RepairReinforcedWindow
      - RepairHullWindow
      - RepairHeavyWindow
      - RepairArmoredWindow
      - RepairDoor
      - RepairHeavyDoor
      - RepairDocking
      - RepairLight
      - RepairElectronics
      - RepairDecor
      - RepairFurniture
      - RepairSeat
