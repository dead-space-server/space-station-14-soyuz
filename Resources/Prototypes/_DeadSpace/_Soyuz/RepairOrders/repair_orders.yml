- type: entity
  parent: BaseItem
  id: RepairStructuralAnalyzerAssembly
  name: unfinished repair structural analyzer
  description: A partially assembled structural analyzer.
  components:
  - type: Sprite
    sprite: Objects/Tools/t-ray.rsi
    state: tray-off
  - type: Item
    size: Small
    sprite: Objects/Tools/t-ray.rsi
  - type: Construction
    graph: RepairStructuralAnalyzer
    node: assembly
  - type: PhysicalComposition
    materialComposition:
      Steel: 300

- type: entity
  parent: BaseItem
  id: RepairStructuralAnalyzer
  name: repair structural analyzer
  description: A portable engineering device that highlights unfinished structural repair tasks.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Tools/repair_structural_analyzer.rsi
    layers:
    - state: structural-analyzer-off
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    size: Small
    sprite: _DeadSpace/_Soyuz/Objects/Tools/repair_structural_analyzer.rsi
  - type: RepairStructuralAnalyzer
    range: 7
  - type: ItemToggle
    popupActivate: repair-structural-analyzer-popup-on
    popupDeactivate: repair-structural-analyzer-popup-off
  - type: Construction
    graph: RepairStructuralAnalyzer
    node: analyzer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: structural-analyzer-on }
          False: { state: structural-analyzer-off }
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Glass: 100

- type: entity
  parent: BaseComputer
  id: RepairOrdersConsole
  name: repair orders console
  description: Used to review and accept station engineering repair orders.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request-eng
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
      state: generic_panel_open
  - type: RepairOrderConsole
  - type: ActivatableUI
    key: enum.RepairOrderUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.RepairOrderUiKey.Key:
        type: RepairOrderBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: AccessReader
    access: [["Engineering"]]
  - type: Computer
    board: RepairOrdersComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#EFB341"

- type: entity
  parent: BaseComputerCircuitboard
  id: RepairOrdersComputerCircuitboard
  name: repair orders console computer board
  description: A computer printed circuit board for a repair orders console.
  components:
  - type: Sprite
    state: cpu_engineering
  - type: ComputerBoard
    prototype: RepairOrdersConsole

