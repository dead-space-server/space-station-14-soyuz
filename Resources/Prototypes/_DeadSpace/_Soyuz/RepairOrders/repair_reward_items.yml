- type: entity
  parent: PowerDrill
  id: RepairCrewPowerDrill
  name: repair crew power drill
  description: A reinforced power drill issued to repair crews for rapid assembly work.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Objects/Tools/RepairOrders/repair_crew_drill.rsi
  - type: Item
    sprite: _DeadSpace/_Soyuz/Objects/Tools/RepairOrders/repair_crew_drill.rsi
  - type: Tool
    speedModifier: 2
  - type: MultipleTool
    entries:
    - behavior: Screwing
      sprite:
        sprite: _DeadSpace/_Soyuz/Objects/Tools/RepairOrders/repair_crew_drill.rsi
        state: drill_screw
      useSound: /Audio/Items/drill_use.ogg
      changeSound: /Audio/Items/change_drill.ogg
    - behavior: Anchoring
      sprite:
        sprite: _DeadSpace/_Soyuz/Objects/Tools/RepairOrders/repair_crew_drill.rsi
        state: drill_bolt
      useSound: /Audio/Items/drill_use.ogg
      changeSound: /Audio/Items/change_drill.ogg

