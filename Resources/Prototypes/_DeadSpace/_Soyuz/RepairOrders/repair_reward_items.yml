- type: entity
  parent: BaseFlatpack
  id: RepairOrderThrusterMediumFlatpack
  name: rocket thruster flatpack
  description: A flatpack used for constructing a medium rocket thruster.
  components:
  - type: Flatpack
    entity: ThrusterMedium
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#EFB341"
    - state: icon-default

- type: entity
  parent: BaseFlatpack
  id: RepairOrderApuFlatpack
  name: APU flatpack
  description: A flatpack used for constructing a wall-mounted auxiliary power unit.
  components:
  - type: Flatpack
    entity: GeneratorWallmountAPU
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#EFB341"
    - state: icon-default

- type: entity
  parent: BaseFlatpack
