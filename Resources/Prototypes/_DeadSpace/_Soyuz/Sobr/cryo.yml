# Базовый
- type: entity
  parent: BaseStructure
  id: BaseSobrCryoCapsule
  name: криокапсула СОБР
  description: Капсула глубокого сна бойца СОБР. Активируется командованием.
  abstract: true
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Sobr/cryo.rsi
    drawdepth: Mobs
    noRot: true
    offset: 0, 0.5
    state: cryobase
  - type: InteractionOutline
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: SobrCryoCapsule
    wakeSound: /Audio/_DeadSpace/Misc/rig_equip.ogg
    refillMinutes: 20
    fighters: {}

- type: entity
  parent: BaseSobrCryoCapsule
