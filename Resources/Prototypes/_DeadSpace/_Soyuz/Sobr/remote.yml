- type: entity
  parent: BaseItem
  id: SobrSquadRemote
  name: пульт пробуждения отрядов
  description: Выводит бойцов выбранного отряда из криосна.
  suffix: Все отряды
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Sobr/remote.rsi
    state: remote
  - type: SobrSquadRemote
    squads:
    - SobrSquadGamma
    - SobrSquadRed
    - SobrSquadAmber
    - SobrSquadEngineers
    - SobrSquadSierra
    - SobrSquadCburn
    - SobrSquadScst
    - SobrSquadScnt
    - SobrSquadBsaa
    - SobrSquadDeathSquad
    - SobrSquadNavy
  - type: ActivatableUI
    key: enum.SobrRemoteUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.SobrRemoteUiKey.Key:
        type: SobrRemoteBoundUserInterface

- type: entity
  parent: BaseItem
  id: SobrSquadRemoteSpecial
  name: пульт особых капсул
  description: Выводит бойцов особых подразделений специального назначения из криосна.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Sobr/remote.rsi
    state: remote-special
  - type: SobrSquadRemote
    squads:
    - SobrSquadDeathSquad
    - SobrSquadNavy
  - type: ActivatableUI
    key: enum.SobrRemoteUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.SobrRemoteUiKey.Key:
        type: SobrRemoteBoundUserInterface

- type: entity
  parent: SobrSquadRemote
  id: SobrSquadRemoteLimit
  suffix: Все отряды, лимит радиуса и кулдаун на пробуждение
  components:
  - type: SobrSquadRemote
    maxRange: 40
    cooldown: 2

