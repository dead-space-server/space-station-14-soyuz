- type: entity
  parent: BaseItem
  id: RMCHelmetGarbBase
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Tiny
  - type: HelmetAccessory
  - type: Appearance

- type: entity
  parent: RMCHelmetGarbBase
  id: RMCHelmetGarbToggleableBase
  abstract: true
  components:
  - type: ItemToggle
    activated: false
    verbToggleOff: rmc-helmetgarbs-off
    verbToggleOn: rmc-helmetgarbs-on

- type: entity
  parent: [ClothingEyesBase, RMCHelmetGarbToggleableBase]
  id: RMCGogglesBallistic
  name: marine ballistic goggles
  description: Standard issue USCM goggles. While commonly found mounted atop M10 pattern helmets, they are also capable of preventing insects, dust, and other things from getting into one's eyes.
  components:
  - type: Item
    storedRotation: 0
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/ballistic_goggles.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/ballistic_goggles.rsi
    slots:
    - MASK
    - EYES
  - type: HelmetAccessory
    rsi:
      sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/ballistic_goggles.rsi
      state: helmet
    toggledRsi:
      sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/ballistic_goggles.rsi
      state: helmet-down
    hatRsi:
      sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/ballistic_goggles.rsi
      state: hat
    hatToggledRsi:
      sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/ballistic_goggles.rsi
      state: hat-down

- type: entity
  parent: RMCGogglesBallistic
  id: RMCGogglesM1A1Ballistic # TODO prescription variant
  name: M1A1 marine ballistic goggles
  description: Newer issue UNMC goggles. While commonly found mounted atop M10 pattern helmets, they are also capable of preventing insects, dust, and other things from getting into one's eyes. This version has larger lenses.
  components:
  - type: Sprite
    sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/M1A1_Ballistic_goggles.rsi
  - type: Clothing
    sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/M1A1_Ballistic_goggles.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _DeadSpace/_Soyuz/Clothing/Eyes/Glasses/M1A1_Ballistic_goggles.rsi
      state: helmet